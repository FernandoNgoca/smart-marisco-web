<h2 mat-dialog-title class="dialog-title">
  <i
    class="fa-solid"
    [class.fa-plus]="!isEditMode"
    [class.fa-pen]="isEditMode"
  >
  </i>
  {{ isEditMode ? "Editar Unidade de Medida" : "Nova Unidade de Medida" }}
</h2>

<mat-dialog-content [formGroup]="form">
  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.get('name')?.invalid">
        Nome é obrigatório
      </mat-error>
    </mat-form-field>
  </div>
  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>Símbolo</mat-label>
      <input matInput formControlName="symbol" />
      <mat-error *ngIf="form.get('symbol')?.invalid">
        Símbolo é obrigatório
      </mat-error>
    </mat-form-field>
  </div>
  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>Descrição (opcional)</mat-label>
      <textarea matInput formControlName="description" rows="4"></textarea>
      <mat-error *ngIf="form.get('description')?.invalid">
        A descrição deve ter no máximo 255 caracteres.
      </mat-error>
    </mat-form-field>
  </div>
  <p *ngIf="saveError" class="field-error" role="alert">{{ saveError }}</p>
</mat-dialog-content>

<mat-dialog-actions class="app-action-row" align="end">
  <button mat-button (click)="cancelar()" type="button" class="app-button btn-cancel" [disabled]="isLoading">
    <i class="fa-regular fa-circle-xmark"></i>
    Cancelar
  </button>
  <!-- Botão Salvar com Loading -->
  <button
    mat-raised-button
    (click)="salvar()"
    [disabled]="form.invalid || isLoading"
    type="button"
    class="app-button btn-save"
  >
    <!-- Ícone quando não está carregando -->
    <i *ngIf="!isLoading" class="fa-regular fa-floppy-disk"></i>

    <!-- Texto dinâmico -->
    {{ isLoading ? "A guardar..." : "Guardar" }}
  </button>
</mat-dialog-actions>
