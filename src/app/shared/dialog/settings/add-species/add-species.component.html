<h2 mat-dialog-title class="dialog-title">
  <i
    class="fa-solid"
    [class.fa-plus]="!isEditMode"
    [class.fa-user-pen]="isEditMode"
  >
  </i>
  {{ isEditMode ? "Editar Espécie" : "Nova Espécie" }}
</h2>

<mat-dialog-content [formGroup]="form">
  <div class="row">
    <mat-form-field appearance="fill">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">
        Nome é obrigatório
      </mat-error>
    </mat-form-field>
  </div>
  <div class="row">
    <mat-form-field appearance="fill" class="full">
      <mat-label>Categoria</mat-label>

      <mat-select formControlName="categoryId" [disabled]="isViewMode">
        <mat-option *ngFor="let cat of categorys" [value]="cat.id">
          {{ cat.name }}
        </mat-option>
      </mat-select>

      <mat-error *ngIf="form.get('categoryId')?.hasError('required')">
        Categoria é obrigatória
      </mat-error>
    </mat-form-field>
  </div>
  <div class="row">
    <mat-form-field appearance="fill">
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="description" rows="4"></textarea>
      <mat-error *ngIf="form.get('description')?.hasError('required')">
        Descrição é obrigatória
      </mat-error>
    </mat-form-field>
  </div>
</mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="cancelar()" type="button" class="btn-cancel">
      <i class="fa-regular fa-circle-xmark"></i>
      Cancelar
    </button>
    <!-- Botão Salvar com Loading -->
    <button
      mat-raised-button
      (click)="salvar()"
      [disabled]="form.invalid || isLoading"
      type="submit"
      class="btn-save"
    >

      <!-- Ícone quando não está carregando -->
      <i *ngIf="!isLoading" class="fa-regular fa-floppy-disk"></i>

      <!-- Texto dinâmico -->
      {{ isLoading ? "Salvando..." : "Salvar" }}
    </button>
  </mat-dialog-actions>
