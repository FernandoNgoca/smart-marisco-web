<h2 mat-dialog-title class="dialog-title">
  <i
    class="fa-solid"
    [class.fa-arrow-right-arrow-left]="isEditMode"
    [class.fa-pen]="isEditMode"
  >
  </i>
  Nova entrada de stock
</h2>

<mat-dialog-content [formGroup]="form">
  <div class="row">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Produto</mat-label>

      <mat-select formControlName="stockId" required>
        <mat-option *ngFor="let stock of stocks" [value]="stock.id">
          {{ stock.product?.name }}
        </mat-option>
      </mat-select>

      <mat-error *ngIf="form.get('stockId')?.hasError('required')">
        Produto é obrigatório
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Quantidade a entrar</mat-label>
      <input
        matInput
        type="number"
        formControlName="quantity"
        min="0.001" [max]="maxQuantity" step="0.001"
        placeholder="Ex: 10"
      />
      <mat-error *ngIf="form.get('quantity')?.hasError('required')">
        Entrada é obrigatória
      </mat-error>
      <mat-error *ngIf="form.get('quantity')?.hasError('quantity')">
        {{ quantityMessage }}
      </mat-error>
    </mat-form-field>
  </div>
  <p *ngIf="saveError" class="field-error" role="alert">{{ saveError }}</p>
</mat-dialog-content>

<mat-dialog-actions class="app-action-row" align="end">
  <button mat-button (click)="cancelar()" type="button" class="app-button btn-cancel" [disabled]="isLoading">
    <i class="fa-regular fa-circle-xmark"></i>
    Cancelar
  </button>
  <!-- Botão Salvar com Loading -->
  <button
    mat-raised-button
    (click)="salvar()"
    [disabled]="form.invalid || isLoading"
    type="button"
    class="app-button btn-save"
  >
    <!-- Ícone quando não está carregando -->
    <i *ngIf="!isLoading" class="fa-regular fa-floppy-disk"></i>

    <!-- Texto dinâmico -->
    {{ isLoading ? "A guardar..." : "Guardar" }}
  </button>
</mat-dialog-actions>
