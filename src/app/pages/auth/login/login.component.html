<div class="login-container">
  <div class="login-card">
    <div class="header">
      <img src="assets/login.png" alt="Logo" class="logo" />
      <h2>Ngalito's Print</h2>
      <p>Faça login para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="login()">
      <div class="input-group">
        <label>Seu username</label>
        <input
          type="text"
          formControlName="username"
          placeholder="Digite seu username"
          autocomplete="username"
          [class.invalid]="form.get('username')?.invalid && form.get('username')?.touched"
        />
        <small *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
          Username é obrigatório
        </small>
      </div>

      <div class="input-group">
        <label>Sua senha</label>
        <div class="password-wrapper">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          <mat-icon class="password-icon" (click)="hidePassword = !hidePassword">
            {{ hidePassword ? "visibility_off" : "visibility" }}
          </mat-icon>
        </div>
        <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Senha é obrigatória
        </small>
      </div>

      <button type="submit" [disabled]="form.invalid">
        Entrar
      </button>

      <p *ngIf="error" class="error">{{ error }}</p>
    </form>
  </div>
</div>
