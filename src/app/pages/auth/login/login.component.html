<main class="login-container">
  <section class="login-card" aria-labelledby="login-title">
    <div class="header">
      <img src="assets/log.png" alt="" class="logo" />
      <h1 id="login-title">Mariscos do Índico</h1>
      <p>Inicie sessão para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="login()" [attr.aria-busy]="isLoading">
      <div class="input-group">
        <label for="login-username">Utilizador</label>
        <input id="login-username" name="username" type="text" formControlName="username"
          placeholder="Introduza o seu utilizador" autocomplete="username"
          autocapitalize="none" spellcheck="false" [readonly]="isLoading"
          [attr.aria-invalid]="form.get('username')?.invalid && form.get('username')?.touched"
          [attr.aria-describedby]="form.get('username')?.invalid && form.get('username')?.touched ? 'username-error' : null"
          [class.invalid]="form.get('username')?.invalid && form.get('username')?.touched" />
        <small id="username-error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
          Introduza um utilizador válido.
        </small>
      </div>

      <div class="input-group">
        <label for="login-password">Palavra-passe</label>
        <div class="password-wrapper">
          <input id="login-password" name="password" [type]="hidePassword ? 'password' : 'text'"
            formControlName="password" placeholder="Introduza a sua palavra-passe"
            autocomplete="current-password" [readonly]="isLoading"
            [attr.aria-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
            [attr.aria-describedby]="form.get('password')?.invalid && form.get('password')?.touched ? 'password-error' : null"
            [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched" />
          <button type="button" class="password-toggle" aria-controls="login-password"
            [attr.aria-label]="hidePassword ? 'Mostrar palavra-passe' : 'Ocultar palavra-passe'"
            (click)="hidePassword = !hidePassword">
            <mat-icon aria-hidden="true">{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <small id="password-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          A palavra-passe é obrigatória.
        </small>
      </div>

      <button class="submit-button" type="submit" [disabled]="form.invalid || isLoading">
        {{ isLoading ? 'A entrar…' : 'Entrar' }}
      </button>
      <p class="login-status" role="status">{{ isLoading ? 'A iniciar sessão. Aguarde.' : '' }}</p>
      <p class="error" role="alert" aria-atomic="true">{{ error }}</p>
    </form>
  </section>
</main>
