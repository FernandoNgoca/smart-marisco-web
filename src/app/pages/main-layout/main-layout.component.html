<app-toolbar-menu
  [menuTitle]="menuName"
  [popText]="popText"
  [shadow]="applyShadow"
  [items_menu]="items_menu"
  >
</app-toolbar-menu>
<mat-sidenav-container>
  <mat-sidenav
    class="sidenav mat-elevation-z2"
    #sidenav
    [opened]="!isSmallScreen"
    [fixedInViewport]="true"
    [mode]="sidenavMode"
  >
    <div class="profile">
      <img class="avatar" [src]="getImage(this.image)" alt="">
      <div class="profile-text">
        <a routerLink="/users" class="name">{{userName}}</a>
        <span class="designation">{{userRole}}</span>
      </div>
    </div>
    <p class="nav-label">Navegação</p>
    <mat-nav-list>
      <a *ngFor="let item of items_menu" mat-list-item
      [routerLink]="item.link" routerLinkActive="active">
        <mat-icon fontSet="fa" [fontIcon]="item.icon"></mat-icon>
        <span>{{item.label}}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="page-header">
      <button
        matTooltip="{{sidenav.opened ? 'Fechar menu' : 'Abrir menu'}}"
        matTooltipPosition="right"
        mat-icon-button
        class="example-icon"
        [attr.aria-label]="sidenav.opened ? 'Fechar menu' : 'Abrir menu'"
        (click)="sidenav.toggle()"
      >
        <mat-icon>{{sidenav.opened ? 'menu_open' : 'menu'}}</mat-icon>
      </button>
      <h1 class="page-title" *ngIf="!popText">{{menuName}}</h1>
    </div>

    <router-outlet></router-outlet>

  </mat-sidenav-content>
</mat-sidenav-container>
