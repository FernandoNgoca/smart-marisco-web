<app-toolbar-menu
  [menuTitle]="menuName"
  [popText]="popText"
  [shadow]="applyShadow"
  [items_menu]="items_menu"
  [menuOpened]="sidenav.opened"
  (toggleMenu)="sidenav.toggle()"
  >
</app-toolbar-menu>
<mat-sidenav-container>
  <mat-sidenav
    class="sidenav mat-elevation-z2"
    #sidenav
    [opened]="!isSmallScreen"
    [fixedInViewport]="true"
    [mode]="sidenavMode"
  >
    <div class="profile">
      <img class="avatar" [src]="getImage(this.image)" alt="">
      <div class="profile-text">
        <a routerLink="/users" class="name">{{userName}}</a>
        <span class="designation">{{userRole}}</span>
      </div>
    </div>
    <p class="nav-label">Navegação</p>
    <mat-nav-list>
      <a *ngFor="let item of items_menu" mat-list-item
      [routerLink]="item.link" routerLinkActive="active">
        <mat-icon fontSet="fa" [fontIcon]="item.icon"></mat-icon>
        <span>{{item.label}}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="page-spacer"></div>

    <router-outlet></router-outlet>

  </mat-sidenav-content>
</mat-sidenav-container>
