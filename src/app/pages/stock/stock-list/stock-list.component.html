<div class="toolbar app-list-toolbar">
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Pesquisar</mat-label>
    <input matInput [value]="filterValue" (keyup)="applyFilter($event)" placeholder="Ex: Nome" />
    <button mat-icon-button matSuffix>
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>
  </mat-form-field>

  <button mat-raised-button class="app-button btn-add" (click)="abrirDialog()">
    <i class="fa-solid fa-plus"></i>
    Adicionar
  </button>
</div>

<div class="app-table-panel">
  <div class="app-table-scroll">
  <mat-table class="app-data-table stock-table" style="--table-min-width: 760px" mat-table [dataSource]="dataSource" matSort>
    <!-- name -->
    <ng-container matColumnDef="product">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Produto</mat-header-cell>
      <mat-cell *matCellDef="let stock">{{ stock.product?.name }}</mat-cell>
    </ng-container>

    <!-- quantity -->
    <ng-container matColumnDef="quantity">
      <mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before"
        >Quantidade</mat-header-cell
      >
      <mat-cell *matCellDef="let stock">
        <strong class="stock-quantity">{{ formatQuantity(stock.quantity) }}</strong>
      </mat-cell>
    </ng-container>

    <!-- unit -->
    <ng-container matColumnDef="unit">
      <mat-header-cell *matHeaderCellDef >Unidade</mat-header-cell>
      <mat-cell *matCellDef="let stock">{{ stock.product?.unit?.symbol }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="state">
      <mat-header-cell *matHeaderCellDef>Estado</mat-header-cell>
      <mat-cell *matCellDef="let stock"><span class="stock-badge" [class.empty]="stock.quantity <= 0" [class.low]="stock.quantity > 0 && stock.quantity <= 5">{{stock.quantity <= 0 ? 'Esgotado' : stock.quantity <= 5 ? 'Stock baixo' : 'Disponível'}}</span></mat-cell>
    </ng-container>
    <ng-container matColumnDef="action">
      <mat-header-cell *matHeaderCellDef >Ações</mat-header-cell>
      <mat-cell *matCellDef="let stock">
        <!-- Ícone de editar -->
        <button
          mat-icon-button
          color="primary"
          (click)="abrirContadoresDialog(stock)"
          matTooltip="Ver movimentos de stock" aria-label="Ver movimentos de stock"
        >
          <i class="fa-solid fa-arrow-right-arrow-left"></i>
        </button>
        <!-- Ícone de editar -->
        <!-- <button mat-icon-button color="primary" (click)="editarStock(stock)">
          <i class="fa-solid fa-user-pen"></i>
        </button> -->

        <!-- Ícone de deletar -->
        <button
          mat-icon-button
          color="warn"
          (click)="desativarStock(stock)"
          matTooltip="Desativar stock" aria-label="Desativar stock"
        >
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </mat-cell>
    </ng-container>

    <!-- Header / Rows -->
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let product; columns: displayedColumns"></mat-row>

    <!-- Sem dados -->
    <!-- Sem dados -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">Não há produtos em stock para esta pesquisa.</td>
    </tr>
  </mat-table>
  </div>

  <mat-paginator class="app-table-paginator"
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
  >
  </mat-paginator>
</div>
