<div class="content mat-elevation-z4">
  <app-toolbar-title title="Conta e utilizadores" icon="fa-user-gear">
    <button mat-icon-button>
      <mat-icon>share</mat-icon>
    </button>
  </app-toolbar-title>
  <nav mat-tab-nav-bar ngClass="tabs">
    <a
      mat-tab-link
      routerLink="/users/myProfile"
      routerLinkActive="active-link"
    >
      <mat-icon>person</mat-icon>
      Perfil
    </a>
    <a *ngIf="auth.hasRole('ROLE_ADMIN')" mat-tab-link routerLink="/users/addUser" routerLinkActive="active-link">
      <mat-icon>person_add</mat-icon>
      Adicionar utilizador
    </a>
    <a
      mat-tab-link
      *ngIf="auth.hasRole('ROLE_ADMIN')"
      routerLink="/users/allUser"
      routerLinkActive="active-link"
    >
      <mat-icon>people</mat-icon>
      Utilizadores
    </a>
  </nav>
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>
