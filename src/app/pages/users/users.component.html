<div class="content mat-elevation-z4">

      <mat-icon>share</mat-icon>
    </button>
  </app-toolbar-title>
  <nav mat-tab-nav-bar ngClass="tabs">
    <a
      mat-tab-link
      routerLink="/users/myProfile"
      routerLinkActive="active-link"
    >
      <mat-icon>person</mat-icon>

    </a>
    <a mat-tab-link routerLink="/users/addUser" routerLinkActive="active-link">
      <mat-icon>person_add</mat-icon>

    <a
      mat-tab-link
      routerLink="/users/allUser"
      routerLinkActive="active-link"

    </a>

  <div class="container">
    <router-outlet></router-outlet>
  </div>
